<text font-size="11" fill="#4A4A4A" text-anchor="middle"><tspan x="220.3" y="130.4">Died within 30 days</tspan></text>
<rect x="299.0" y="114.0" width="240.4" height="26.0" rx="13" fill="#FFFFFF" stroke="#A8A8A8" stroke-width="1"/>
<text font-size="11" fill="#4A4A4A" text-anchor="middle"><tspan x="419.2" y="130.4">Share of beds vs share of patients</tspan></text>
<rect x="20.0" y="150.0" width="690.0" height="330.0" rx="10" fill="#FFFFFF" stroke="#A8A8A8" stroke-width="1"/>
<text font-size="13" fill="#1F2328" text-anchor="start" font-weight="bold"><tspan x="36.0" y="173.0">How badly each road user is hurt, 2011-2021</tspan></text>
