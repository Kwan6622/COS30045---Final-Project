<text font-size="10.5" fill="#4A4A4A" text-anchor="start"><tspan x="772.0" y="277.5">Reference line = all road users,</tspan><tspan x="772.0" y="291.7">including the small "other" group</tspan></text>
<circle cx="752.0" cy="316.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
