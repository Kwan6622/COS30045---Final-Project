<text font-size="10.5" fill="#1F2328" text-anchor="start"><tspan x="772.0" y="319.5">v2 one Tab stop, ↑ ↓ between rows;</tspan><tspan x="772.0" y="333.7">the whole row is the focus target</tspan></text>
<circle cx="752.0" cy="358.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
