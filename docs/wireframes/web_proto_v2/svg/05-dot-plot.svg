<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680" font-family="Helvetica, Arial, sans-serif">
<title>05 Ch2 How badly - dot plot</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#4A4A4A"/></marker></defs>
<rect width="1040" height="680" fill="#FFFFFF"/>
<text font-size="20" fill="#1F2328" text-anchor="start" font-weight="bold"><tspan x="22.0" y="33.1">Chapter 2 "How badly": Cleveland dot plot</tspan></text>
<text font-size="12" fill="#7A7A7A" text-anchor="start"><tspan x="22.0" y="52.7">One marker per road user, sorted by the chosen measure; dotted line = all road users. v2: shapes, teaser prompt, row focus, table.</tspan></text>
<rect x="20.0" y="66.0" width="690.0" height="40.0" rx="6" fill="#EFEFEF" stroke="none" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="start"><tspan x="22.0" y="81.9">Try this: Switch to Died within 30 days: pedestrians stay on top, at 3.6 times the rate for people in cars.</tspan><tspan x="22.0" y="96.8">Which group drops to the bottom?</tspan></text>
