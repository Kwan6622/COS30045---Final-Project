<circle cx="16.0" cy="66.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle" font-weight="bold"><tspan x="16.0" y="69.4">1</tspan></text>
<rect x="20.0" y="114.0" width="121.6" height="26.0" rx="13" fill="#1F2328" stroke="#1F2328" stroke-width="1"/>
<text font-size="11" fill="#FFFFFF" text-anchor="middle"><tspan x="80.8" y="130.4">Days in hospital</tspan></text>
