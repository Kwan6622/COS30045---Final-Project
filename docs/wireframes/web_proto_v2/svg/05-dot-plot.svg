<text font-size="10.5" fill="#1F2328" text-anchor="start"><tspan x="772.0" y="219.5">v2 the prompt gives half the answer,</tspan><tspan x="772.0" y="233.7">so readers who never click still get</tspan><tspan x="772.0" y="247.8">the point (explanatory first, W3.1)</tspan></text>
<circle cx="752.0" cy="274.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
