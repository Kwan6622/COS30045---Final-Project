<text font-size="9" fill="#7A7A7A" text-anchor="middle"><tspan x="600.0" y="309.7">(Source, year)</tspan></text>
<rect x="52.0" y="330.0" width="56.0" height="16.0" rx="3" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.5"/>
<text font-size="9" fill="#1F2328" text-anchor="middle" font-weight="bold"><tspan x="80.0" y="340.7">DRIVER</tspan></text>
<rect x="116.0" y="331.0" width="416.0" height="14.0" rx="3" fill="#EFEFEF" stroke="none" stroke-width="1"/>
<rect x="540.0" y="329.0" width="120.0" height="16.0" rx="8" fill="#FFFFFF" stroke="#A8A8A8" stroke-width="1"/>
<text font-size="9" fill="#7A7A7A" text-anchor="middle"><tspan x="600.0" y="339.7">(Source, year)</tspan></text>
<rect x="52.0" y="360.0" width="56.0" height="16.0" rx="3" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.5"/>
<text font-size="9" fill="#1F2328" text-anchor="middle" font-weight="bold"><tspan x="80.0" y="370.7">DRIVER</tspan></text>
<rect x="116.0" y="361.0" width="416.0" height="14.0" rx="3" fill="#EFEFEF" stroke="none" stroke-width="1"/>
<rect x="540.0" y="359.0" width="120.0" height="16.0" rx="8" fill="#FFFFFF" stroke="#A8A8A8" stroke-width="1"/>
<text font-size="9" fill="#7A7A7A" text-anchor="middle"><tspan x="600.0" y="369.7">(Source, year)</tspan></text>
<circle cx="676.0" cy="306.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle" font-weight="bold"><tspan x="676.0" y="309.4">3</tspan></text>
<text font-size="12" fill="#4A4A4A" text-anchor="start" font-weight="bold"><tspan x="38.0" y="408.7">Extra protection</tspan></text>
<rect x="52.0" y="423.0" width="56.0" height="16.0" rx="3" fill="#FFFFFF" stroke="#7A7A7A" stroke-width="1.5" stroke-dasharray="5 4"/>
<text font-size="9" fill="#4A4A4A" text-anchor="middle" font-weight="bold"><tspan x="80.0" y="433.7">EXTRA</tspan></text>
<rect x="116.0" y="424.0" width="416.0" height="14.0" rx="3" fill="#EFEFEF" stroke="none" stroke-width="1"/>
<rect x="52.0" y="453.0" width="56.0" height="16.0" rx="3" fill="#FFFFFF" stroke="#7A7A7A" stroke-width="1.5" stroke-dasharray="5 4"/>
<text font-size="9" fill="#4A4A4A" text-anchor="middle" font-weight="bold"><tspan x="80.0" y="463.7">EXTRA</tspan></text>
<rect x="116.0" y="454.0" width="416.0" height="14.0" rx="3" fill="#EFEFEF" stroke="none" stroke-width="1"/>
<circle cx="30.0" cy="396.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle" font-weight="bold"><tspan x="30.0" y="399.4">4</tspan></text>
<polyline points="92.0,134.0 92.0,148.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="730.0" y="70.0" width="290.0" height="354.0" rx="8" fill="#EFEFEF" stroke="#D4D4D4" stroke-width="1"/>
<text font-size="12" fill="#1F2328" text-anchor="start" font-weight="bold"><tspan x="744.0" y="91.7">Notes  (v2 = new in this version)</tspan></text>
<text font-size="9.5" fill="#4A4A4A" text-anchor="start" font-style="italic"><tspan x="744.0" y="112.9">Redraws on: role</tspan></text>
<circle cx="752.0" cy="136.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle" font-weight="bold"><tspan x="752.0" y="139.4">1</tspan></text>
<text font-size="10.5" fill="#4A4A4A" text-anchor="start"><tspan x="772.0" y="139.5">Four role buttons: type=button,</tspan><tspan x="772.0" y="153.7">aria-pressed; choice kept in state</tspan></text>
<circle cx="752.0" cy="178.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle" font-weight="bold"><tspan x="752.0" y="181.4">2</tspan></text>
<text font-size="10.5" fill="#4A4A4A" text-anchor="start"><tspan x="772.0" y="181.5">Numbers from earlier chapters</tspan><tspan x="772.0" y="195.7">that matter for this role</tspan></text>
<circle cx="752.0" cy="220.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle" font-weight="bold"><tspan x="752.0" y="223.4">3</tspan></text>
<text font-size="10.5" fill="#4A4A4A" text-anchor="start"><tspan x="772.0" y="223.5">Actions in Safe System order</tspan><tspan x="772.0" y="237.7">(system and drivers first), each</tspan><tspan x="772.0" y="251.8">with an APA citation. v2 tags 12 px</tspan></text>
<circle cx="752.0" cy="278.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle" font-weight="bold"><tspan x="752.0" y="281.4">4</tspan></text>
<text font-size="10.5" fill="#4A4A4A" text-anchor="start"><tspan x="772.0" y="281.5">Self-protection tips labelled</tspan><tspan x="772.0" y="295.7">"extra protection" so they don't</tspan><tspan x="772.0" y="309.9">read as victim-blaming</tspan></text>
<circle cx="752.0" cy="336.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle" font-weight="bold"><tspan x="752.0" y="339.4">5</tspan></text>
<text font-size="10.5" fill="#4A4A4A" text-anchor="start"><tspan x="772.0" y="339.5">Panel is aria-live=polite: the new</tspan><tspan x="772.0" y="353.7">role's content is read out</tspan></text>
<circle cx="752.0" cy="378.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle" font-weight="bold"><tspan x="752.0" y="381.4">6</tspan></text>
<text font-size="10.5" fill="#1F2328" text-anchor="start"><tspan x="772.0" y="381.5">v2 action level shown by style, not</tspan><tspan x="772.0" y="395.7">colour: solid / outline / dashed,</tspan><tspan x="772.0" y="409.9">with the order as a key</tspan></text>
</svg>