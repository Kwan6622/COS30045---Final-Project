<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680" font-family="Helvetica, Arial, sans-serif">
<title>10 Ch5 What you can do - role picker</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#4A4A4A"/></marker></defs>
<rect width="1040" height="680" fill="#FFFFFF"/>
<text font-size="20" fill="#1F2328" text-anchor="start" font-weight="bold"><tspan x="22.0" y="33.1">Chapter 5 "What you can do": role picker + action panel</tspan></text>
<text font-size="12" fill="#7A7A7A" text-anchor="start"><tspan x="22.0" y="52.7">The reader picks how they use the road; the panel repeats the relevant numbers and lists sourced actions.</tspan></text>
<rect x="20.0" y="70.0" width="164.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#1F2328" stroke-width="2"/>
<text font-size="11" fill="#1F2328" text-anchor="middle" font-weight="bold"><tspan x="102.0" y="95.9">I drive</tspan><tspan x="102.0" y="110.8">car, ute or van</tspan></text>
<polyline points="30.0,136.0 174.0,136.0" fill="none" stroke="#F2B705" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="194.0" y="70.0" width="164.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#A8A8A8" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle"><tspan x="276.0" y="95.9">I walk</tspan><tspan x="276.0" y="110.8">or my parents do</tspan></text>
<rect x="368.0" y="70.0" width="164.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#A8A8A8" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle"><tspan x="450.0" y="95.9">I ride</tspan><tspan x="450.0" y="110.8">bike or e-bike</tspan></text>
<rect x="542.0" y="70.0" width="164.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#A8A8A8" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle"><tspan x="624.0" y="95.9">I make decisions</tspan><tspan x="624.0" y="110.8">council, state, federal</tspan></text>
<circle cx="16.0" cy="70.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle" font-weight="bold"><tspan x="16.0" y="73.4">1</tspan></text>
<rect x="20.0" y="150.0" width="690.0" height="380.0" rx="10" fill="#FFFFFF" stroke="#A8A8A8" stroke-width="1"/>
<text font-size="14" fill="#1F2328" text-anchor="start" font-weight="bold"><tspan x="38.0" y="176.3">When you drive, the people outside your car have no crumple zone</tspan></text>
<rect x="36.0" y="196.0" width="206.0" height="64.0" rx="8" fill="#EFEFEF" stroke="none" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle"><tspan x="139.0" y="216.5">88% of injured</tspan><tspan x="139.0" y="231.4">pedestrians collided</tspan><tspan x="139.0" y="246.2">with a car or van</tspan></text>
<rect x="256.0" y="196.0" width="206.0" height="64.0" rx="8" fill="#EFEFEF" stroke="none" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle"><tspan x="359.0" y="216.5">Pedestrians stay</tspan><tspan x="359.0" y="231.4">9.1 days in hospital</tspan><tspan x="359.0" y="246.2">(car occupants 4.7)</tspan></text>
<rect x="476.0" y="196.0" width="206.0" height="64.0" rx="8" fill="#EFEFEF" stroke="none" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle"><tspan x="579.0" y="216.5">+15% pedestrian</tspan><tspan x="579.0" y="231.4">admissions in June</tspan><tspan x="579.0" y="246.2">vs an average month</tspan></text>
<circle cx="36.0" cy="196.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle" font-weight="bold"><tspan x="36.0" y="199.4">2</tspan></text>
<text font-size="10.5" fill="#4A4A4A" text-anchor="start"><tspan x="38.0" y="284.2">Safe System order:  [SYSTEM] solid  →  [DRIVER] outline  →  [EXTRA] dashed</tspan></text>
<circle cx="30.0" cy="281.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle" font-weight="bold"><tspan x="30.0" y="284.4">6</tspan></text>
