<text font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold"><tspan x="188.8" y="221.4">21%</tspan></text>
<rect x="247.7" y="200.0" width="243.9" height="36.0" rx="0" fill="#4A4A4A" stroke="#FFFFFF" stroke-width="1"/>
<text font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold"><tspan x="369.7" y="221.4">44%</tspan></text>
<rect x="491.6" y="200.0" width="30.7" height="36.0" rx="0" fill="#7A7A7A" stroke="#FFFFFF" stroke-width="1"/>
<rect x="522.3" y="200.0" width="4.6" height="36.0" rx="0" fill="#A8A8A8" stroke="#FFFFFF" stroke-width="1"/>
