<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680" font-family="Helvetica, Arial, sans-serif">
<title>06 Ch2 How badly - stacked bars</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#4A4A4A"/></marker></defs>
<rect width="1040" height="680" fill="#FFFFFF"/>
<text font-size="20" fill="#1F2328" text-anchor="start" font-weight="bold"><tspan x="22.0" y="33.1">Chapter 2 "How badly": what they collided with</tspan></text>
<text font-size="12" fill="#7A7A7A" text-anchor="start"><tspan x="22.0" y="52.7">100% stacked bars, one per group. Categories are not road users, so they use greys; the two that carry the story are darkest and labelled.</tspan></text>
