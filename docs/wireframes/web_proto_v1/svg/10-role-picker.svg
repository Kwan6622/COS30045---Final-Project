<text font-size="11" fill="#4A4A4A" text-anchor="start"><tspan x="772.0" y="120.0">Four role buttons (aria-pressed);</tspan><tspan x="772.0" y="134.8">choice also kept in app state</tspan></text>
<circle cx="752.0" cy="162.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle" font-weight="bold"><tspan x="752.0" y="165.4">2</tspan></text>
<text font-size="11" fill="#4A4A4A" text-anchor="start"><tspan x="772.0" y="166.0">Numbers from earlier chapters</tspan><tspan x="772.0" y="180.8">that matter for this role</tspan></text>
<circle cx="752.0" cy="208.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle" font-weight="bold"><tspan x="752.0" y="211.4">3</tspan></text>
<text font-size="11" fill="#4A4A4A" text-anchor="start"><tspan x="772.0" y="212.0">Actions in Safe System order</tspan><tspan x="772.0" y="226.8">(system and drivers first), each</tspan><tspan x="772.0" y="241.7">with an APA citation</tspan></text>
<circle cx="752.0" cy="272.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle" font-weight="bold"><tspan x="752.0" y="275.4">4</tspan></text>
<text font-size="11" fill="#4A4A4A" text-anchor="start"><tspan x="772.0" y="276.0">Self-protection tips labelled</tspan><tspan x="772.0" y="290.9">"extra protection" so they don't</tspan><tspan x="772.0" y="305.7">read as victim-blaming</tspan></text>
