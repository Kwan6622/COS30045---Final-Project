<text font-size="11" fill="#4A4A4A" text-anchor="start"><tspan x="772.0" y="212.0">Yellow progress bar = how far</tspan><tspan x="772.0" y="226.8">through the story</tspan></text>
<circle cx="752.0" cy="254.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle" font-weight="bold"><tspan x="752.0" y="257.4">4</tspan></text>
<text font-size="11" fill="#4A4A4A" text-anchor="start"><tspan x="772.0" y="258.0">Ch1: chart pinned, each message</tspan><tspan x="772.0" y="272.9">changes what the chart shows</tspan></text>
<circle cx="752.0" cy="300.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle" font-weight="bold"><tspan x="752.0" y="303.4">5</tspan></text>
<text font-size="11" fill="#4A4A4A" text-anchor="start"><tspan x="772.0" y="304.0">Arrow buttons / ← → keys: next or</tspan><tspan x="772.0" y="318.9">previous part (each Ch1 message,</tspan><tspan x="772.0" y="333.7">then each chapter)</tspan></text>
