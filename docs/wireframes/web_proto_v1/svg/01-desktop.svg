<rect x="30.0" y="588.0" width="610.0" height="30.0" rx="6" fill="#FFFFFF" stroke="#A8A8A8" stroke-width="1" stroke-dasharray="5 4"/>
<text font-size="11" fill="#4A4A4A" text-anchor="start"><tspan x="38.0" y="605.0">Sources - APA references, limitations</tspan></text>
