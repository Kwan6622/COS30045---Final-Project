<rect x="730.0" y="70.0" width="290.0" height="282.0" rx="8" fill="#EFEFEF" stroke="#D4D4D4" stroke-width="1"/>
<text font-size="13" fill="#1F2328" text-anchor="start" font-weight="bold"><tspan x="744.0" y="92.0">Notes</tspan></text>
<circle cx="752.0" cy="116.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle" font-weight="bold"><tspan x="752.0" y="119.4">1</tspan></text>
<text font-size="11" fill="#4A4A4A" text-anchor="start"><tspan x="772.0" y="120.0">Stepper in its own frame: click a</tspan><tspan x="772.0" y="134.8">chapter name to jump there</tspan></text>
<circle cx="752.0" cy="162.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
<text font-size="11" fill="#1F2328" text-anchor="middle" font-weight="bold"><tspan x="752.0" y="165.4">2</tspan></text>
<text font-size="11" fill="#4A4A4A" text-anchor="start"><tspan x="772.0" y="166.0">Light/dark switch + colour-vision</tspan><tspan x="772.0" y="180.8">preview (remembered)</tspan></text>
<circle cx="752.0" cy="208.0" r="10" fill="#F2B705" stroke="#1F2328" stroke-width="1"/>
