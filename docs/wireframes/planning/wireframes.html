<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wireframes — Outside the Car (web_proto_v1)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .wf-svg-wrap svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #ffffff;
    }
    .tab-btn.is-active {
      background: var(--primary);
      color: var(--primary-foreground);
      border-color: var(--primary);
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 50;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .toast.is-hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased min-h-screen">
  <!-- Sticky Header -->
  <header class="sticky top-0 z-30 border-b border-[var(--border)] bg-[var(--card)]/95 backdrop-blur">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <span class="px-2 py-0.5 text-xs font-semibold rounded bg-[var(--primary)]/15 text-[var(--primary)]">web_proto_v1</span>
          <h1 class="text-base font-bold tracking-tight">Wireframe &amp; Interaction Studio — Outside the Car</h1>
        </div>
        <p class="text-xs text-[var(--muted-foreground)] mt-0.5">
          Wireframe tổng thể website + 8 biểu đồ &amp; tương tác · Export SVG / PNG (HTML5 Canvas) để đưa vào Canva, Figma, Excalidraw, Slides
        </p>
      </div>
      <div class="flex items-center gap-2">
        <button id="export-all-svg" class="px-3 py-1.5 text-xs font-medium rounded-md border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--accent)]/10 transition cursor-pointer">
          ⬇ Export All SVG (9 files)
        </button>
        <button id="export-all-png" class="px-3 py-1.5 text-xs font-medium rounded-md bg-[var(--primary)] text-[var(--primary-foreground)] hover:opacity-90 transition cursor-pointer">
          🖼 Export All PNG 2× (Canvas)
        </button>
      </div>
    </div>

    <!-- Filter Tabs -->
    <div class="max-w-7xl mx-auto px-4 pb-2.5 flex items-center gap-1.5 overflow-x-auto" id="tabs">
      <button class="tab-btn is-active px-2.5 py-1 text-xs font-medium rounded-md border border-[var(--border)] whitespace-nowrap cursor-pointer" data-filter="all">Tất cả (9)</button>
      <button class="tab-btn px-2.5 py-1 text-xs font-medium rounded-md border border-[var(--border)] whitespace-nowrap cursor-pointer" data-filter="site">0. Tổng thể Website</button>
      <button class="tab-btn px-2.5 py-1 text-xs font-medium rounded-md border border-[var(--border)] whitespace-nowrap cursor-pointer" data-filter="ward">1. Ward (Isotype)</button>
      <button class="tab-btn px-2.5 py-1 text-xs font-medium rounded-md border border-[var(--border)] whitespace-nowrap cursor-pointer" data-filter="trend">2. Trend (Scrolly)</button>
      <button class="tab-btn px-2.5 py-1 text-xs font-medium rounded-md border border-[var(--border)] whitespace-nowrap cursor-pointer" data-filter="severity">3. Severity (Dot Plot)</button>
      <button class="tab-btn px-2.5 py-1 text-xs font-medium rounded-md border border-[var(--border)] whitespace-nowrap cursor-pointer" data-filter="counterparty">4. Counterparty (100% Bar)</button>
      <button class="tab-btn px-2.5 py-1 text-xs font-medium rounded-md border border-[var(--border)] whitespace-nowrap cursor-pointer" data-filter="age">5. Age (Vertical Bar)</button>
      <button class="tab-btn px-2.5 py-1 text-xs font-medium rounded-md border border-[var(--border)] whitespace-nowrap cursor-pointer" data-filter="season">6. Seasonality (Line)</button>
      <button class="tab-btn px-2.5 py-1 text-xs font-medium rounded-md border border-[var(--border)] whitespace-nowrap cursor-pointer" data-filter="stateMap">7. State Map + Detail</button>
      <button class="tab-btn px-2.5 py-1 text-xs font-medium rounded-md border border-[var(--border)] whitespace-nowrap cursor-pointer" data-filter="roles">8. Role Picker</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6" id="cards-root"></main>

  <!-- Hidden Canvas for PNG Export -->
  <canvas id="export-canvas" class="hidden"></canvas>

  <!-- Toast -->
  <div id="toast" class="toast is-hidden px-3.5 py-2 rounded-lg bg-[var(--card)] border border-[var(--border)] shadow-lg text-xs font-medium"></div>

  <script>
    // Shared SVG styling defs for clean vector export (works standalone in Canva/Figma/Excalidraw)
    const SVG_DEFS = `
      <defs>
        <pattern id="wf-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="0" y2="8" stroke="#CBD5E1" stroke-width="1.5"/>
        </pattern>
        <marker id="wf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
        </marker>
        <marker id="wf-arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
        </marker>
        <style>
          .t-title { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0F172A; }
          .t-sub { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
          .t-body { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #475569; }
          .t-muted { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #64748B; }
          .t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #334155; }
          .t-badge { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
          .t-callout { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #1D4ED8; }
          .box { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 1.25; }
          .box-card { fill: #FFFFFF; stroke: #475569; stroke-width: 1.5; }
          .box-dash { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 1.25; stroke-dasharray: 4 3; }
          .chip { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.2; }
          .chip-on { fill: #0F172A; stroke: #0F172A; stroke-width: 1.2; }
          .axis { stroke: #475569; stroke-width: 1.25; }
          .grid { stroke: #E2E8F0; stroke-width: 1; stroke-dasharray: 3 3; }
        </style>
      </defs>
    `;

    const badge = (x, y, n) => `
      <g>
        <circle cx="${x}" cy="${y}" r="9.5" fill="#2563EB"/>
        <text x="${x}" y="${y}" class="t-badge">${n}</text>
      </g>
    `;

    const WIREFRAMES = [
      {
        id: "site",
        filename: "00-website-overall-wireframe",
        title: "0. Wireframe tổng thể Website (Outside the Car — Scrollytelling Architecture)",
        subtitle: "index.html + js/main.js · 8 chapter-steps, Fixed Header Stepper, Floating Side-Nav, Scrollama + Global State",
        sourceFiles: ["index.html", "js/main.js", "css/style.css"],
        interactions: [
          { tag: "1", title: "Fixed Header Stepper & Prefs", desc: "Click tên chapter trên #stepper để cuộn mượt tới section tương ứng; tự thu gọn thành số trên màn hình hẹp (fitStepper). Nút Light/Dark (#theme-btn) và Colour Vision (#cvd-select) cập nhật CSS vars & vẽ lại toàn bộ 8 chart." },
          { tag: "2", title: "Progress Bar & Scrollama", desc: "#progress-bar đo % cuộn trang. Scrollama 1 (offset 0.4) theo dõi section.chapter-step để highlight stepper; Scrollama 2 (offset 0.55) điều khiển 5 bước scrollytelling trong Chapter 1." },
          { tag: "3", title: "Floating Side-Nav & Keyboard", desc: "Nút ↑ / ↓ (#prev-btn, #next-btn) và phím ← / → nhảy qua từng 'stop' (8 chapters + 5 scrolly steps của Ch.1). Phím ↑ / ↓ / Space giữ nguyên cuộn tự nhiên." },
          { tag: "4", title: "Single Source of Truth (setState)", desc: "main.js giữ 1 object state duy nhất. Chart hoặc control phát event 'viz:state' → main.js merge patch → gọi mod.update(state) cho cả 8 chart." },
        ],
        svg: () => `
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 980" width="1100" height="980">
            ${SVG_DEFS}

            <!-- Title Bar -->
            <text x="28" y="34" class="t-title">OVERALL WEBSITE WIREFRAME — OUTSIDE THE CAR (web_proto_v1)</text>
            <text x="28" y="52" class="t-muted">Desktop Viewport (1100px) · Single-page vertical scrollytelling · 8 Chapters · D3.js v7 + Scrollama 3.2</text>

            <!-- Browser Frame -->
            <rect x="28" y="68" width="800" height="888" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>

            <!-- Fixed Header -->
            <rect x="28" y="68" width="800" height="52" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
            <rect x="28" y="108" width="800" height="12" fill="#F1F5F9"/>
            <line x1="28" y1="120" x2="828" y2="120" stroke="#334155" stroke-width="1.5"/>
            <text x="44" y="96" class="t-sub">Outside the Car</text>
            <!-- Stepper pills -->
            <g transform="translate(155, 82)">

              <rect x="50" y="0" width="44" height="22" rx="11" class="chip"/><text x="72" y="14" class="t-muted" text-anchor="middle">1 Who</text>
              <rect x="100" y="0" width="60" height="22" rx="11" class="chip"/><text x="130" y="14" class="t-muted" text-anchor="middle">2 How badly</text>
              <rect x="166" y="0" width="42" height="22" rx="11" class="chip"/><text x="187" y="14" class="t-muted" text-anchor="middle">3 Age</text>
              <rect x="214" y="0" width="76" height="22" rx="11" class="chip"/><text x="252" y="14" class="t-muted" text-anchor="middle">4 When/Where</text>
              <rect x="296" y="0" width="54" height="22" rx="11" class="chip"/><text x="323" y="14" class="t-muted" text-anchor="middle">5 Action</text>
              <rect x="356" y="0" width="56" height="22" rx="11" class="chip"/><text x="384" y="14" class="t-muted" text-anchor="middle">6 Sum</text>
              <rect x="418" y="0" width="52" height="22" rx="11" class="chip"/><text x="444" y="14" class="t-muted" text-anchor="middle">7 Src</text>

            <!-- Theme & CVD -->
            <rect x="646" y="82" width="56" height="22" rx="5" class="chip"/><text x="674" y="96" class="t-muted" text-anchor="middle">☾ Dark</text>

            <!-- Progress bar -->
            <rect x="28" y="116" width="260" height="4" fill="#E11D48"/>
            ${badge(828, 86, 1)}

            <!-- Section 0: START -->
            <g transform="translate(48, 134)">
              <rect x="0" y="0" width="760" height="114" rx="6" class="box"/>
              <text x="12" y="18" class="t-sub">0. #s-start · HERO &amp; THE WARD</text>
              <text x="12" y="34" class="t-muted">Eyebrow + H1 ("Every day, [X] hospital beds...") + Lede</text>
              <rect x="12" y="42" width="490" height="60" rx="4" class="box-card"/>
              <text x="22" y="58" class="t-body" font-weight="600">Chart 1: ward.js (Isotype Bed Grid · 24 cols)</text>
              <text x="22" y="74" class="t-muted">[Pedestrian beds ■■] + [Cyclist beds ■■] · Animate on first enter</text>
              <rect x="514" y="42" width="234" height="60" rx="4" class="box-dash"/>
              <text x="524" y="58" class="t-body" font-weight="600">Aside .insight (2-col)</text>
              <text x="524" y="74" class="t-muted">What it means / What is being done</text>
              <text x="524" y="90" class="t-muted">+ How-to scroll cue (↓ / Space / →)</text>
            </g>

            <!-- Section 1: WHO (Scrollytelling) -->
            <g transform="translate(48, 258)">
              <rect x="0" y="0" width="760" height="132" rx="6" class="box"/>
              <text x="12" y="18" class="t-sub">1. #s-who · CHAPTER 1: WHO (Scrollytelling 2-Column)</text>
              <!-- Left Sticky -->
              <rect x="12" y="28" width="440" height="92" rx="4" class="box-card"/>
              <text x="22" y="46" class="t-body" font-weight="600">Sticky .scrolly-graphic → Chart 2: trend.js</text>
              <text x="22" y="62" class="t-muted">4-line chart (2011–2021) + COVID band + NSW 2017 line</text>
              <rect x="22" y="76" width="110" height="20" rx="10" class="chip-on"/><text x="77" y="89" class="t-badge" style="font-size:8.5px">Change since 2012</text>
              <rect x="138" y="76" width="120" height="20" rx="10" class="chip"/><text x="198" y="89" class="t-muted" text-anchor="middle">Number of admissions</text>
              <!-- Right Scrolling Steps -->
              <rect x="466" y="28" width="282" height="92" rx="4" class="box-dash"/>
              <text x="476" y="45" class="t-body" font-weight="600">Scrolling .scrolly-text (5 steps)</text>
              <rect x="476" y="52" width="262" height="18" rx="3" fill="#E0F2FE" stroke="#0284C7"/>
              <text x="484" y="64" class="t-muted">Step 1..5 (.scrolly-step) → updates trendFocus</text>
              <text x="476" y="88" class="t-muted">Scrollama offset: 0.55</text>
              <text x="476" y="104" class="t-muted">+ Bottom 2-col .insight</text>
              <path d="M 466 74 L 454 74" stroke="#2563EB" stroke-width="2" marker-end="url(#wf-arrow)"/>
              ${badge(460, 48, 2)}
            </g>

            <!-- Section 2: HOW BADLY -->
            <g transform="translate(48, 400)">
              <rect x="0" y="0" width="760" height="106" rx="6" class="box"/>
              <text x="12" y="18" class="t-sub">2. #s-how · CHAPTER 2: HOW BADLY</text>
              <rect x="12" y="26" width="364" height="68" rx="4" class="box-card"/>
              <text x="22" y="44" class="t-body" font-weight="600">Chart 3: severity.js (Cleveland Dot Plot)</text>
              <text x="22" y="60" class="t-muted">Chips: [Days in hospital] [Died 30d] [Bed/Patient ratio]</text>
              <text x="22" y="76" class="t-muted">Sorted horizontal dots + avg vertical ref line</text>
              <rect x="388" y="26" width="360" height="68" rx="4" class="box-card"/>
              <text x="398" y="44" class="t-body" font-weight="600">Chart 4: counterparty.js (100% Stacked Bar)</text>
              <text x="398" y="60" class="t-muted">What injured Pedestrians vs Cyclists collided with</text>
              <text x="398" y="76" class="t-muted">Hover category highlights across both bars + .insight</text>
            </g>

            <!-- Section 3: AGE -->
            <g transform="translate(48, 516)">
              <rect x="0" y="0" width="760" height="86" rx="6" class="box"/>
              <text x="12" y="18" class="t-sub">3. #s-age · CHAPTER 3: AGE</text>
              <rect x="12" y="26" width="736" height="50" rx="4" class="box-card"/>
              <text x="22" y="44" class="t-body" font-weight="600">Chart 5: age.js (Vertical Bar Chart · 75+ highlighted)</text>
              <text x="22" y="62" class="t-muted">2 Filter Groups: [Pedestrians | Cyclists] × [Days in hospital | Died 30d | Per 100k] + .insight</text>
            </g>

            <!-- Section 4: WHEN & WHERE -->
            <g transform="translate(48, 612)">
              <rect x="0" y="0" width="760" height="114" rx="6" class="box"/>
              <text x="12" y="18" class="t-sub">4. #s-when · CHAPTER 4: WHEN &amp; WHERE</text>
              <rect x="12" y="26" width="300" height="76" rx="4" class="box-card"/>
              <text x="22" y="44" class="t-body" font-weight="600">Chart 6: season.js (12-Month Line)</text>
              <text x="22" y="60" class="t-muted">1.0× avg line · Winter band · Peak yellow rings</text>
              <rect x="324" y="26" width="424" height="76" rx="4" class="box-card"/>
              <text x="334" y="44" class="t-body" font-weight="600">Chart 7: stateMap.js (.split 2-col: Tile Map + Linked Trend)</text>
              <text x="334" y="60" class="t-muted">Chips: [Pedestrians | Cyclists] → Click state tile → updates right chart</text>
              <text x="334" y="76" class="t-muted">5-step colour ramp legend + State vs Australia line</text>
            </g>

            <!-- Section 5: WHAT YOU CAN DO -->
            <g transform="translate(48, 736)">
              <rect x="0" y="0" width="760" height="76" rx="6" class="box"/>
              <text x="12" y="18" class="t-sub">5. #s-act · CHAPTER 5: WHAT YOU CAN DO (roles.js)</text>
              <rect x="12" y="26" width="736" height="40" rx="4" class="box-card"/>
              <text x="22" y="49" class="t-body">4 Role Cards [🚗 I drive | 🚶 I walk | 🚲 I ride | 🏛️ Policy] → Dynamic Role Panel (3 stats + Safe System actions)</text>
            </g>

            <!-- Section 6 & 7: SUMMARY & SOURCES -->
            <g transform="translate(48, 822)">
              <rect x="0" y="0" width="374" height="72" rx="6" class="box"/>
              <text x="12" y="18" class="t-sub">6. #s-summary · SUMMARY GRID</text>
              <text x="12" y="36" class="t-muted">5 Summary Cards (1 finding + 1 action each)</text>
              <text x="12" y="52" class="t-muted">Each card has [Revisit chapter N] scroll button</text>

              <rect x="386" y="0" width="374" height="72" rx="6" class="box"/>
              <text x="398" y="18" class="t-sub">7. #s-sources · REFERENCES &amp; DATA NOTES</text>
              <text x="398" y="36" class="t-muted">#references list + 7 data-limitation bullets</text>
              <text x="398" y="52" class="t-muted">[Back to the start ↑] button + Footer</text>
            </g>

            <!-- Footer inside browser -->
            <rect x="28" y="906" width="800" height="50" rx="0" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
            <text x="44" y="935" class="t-muted">Footer: DataWerk · COS30045 · D3.js v7 + Scrollama · Floating #tooltip (hidden until pointermove)</text>

            <!-- Floating Side Nav inside Browser -->
            <g transform="translate(772, 430)">
              <rect x="0" y="0" width="44" height="86" rx="22" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
              <circle cx="22" cy="24" r="14" fill="#F1F5F9" stroke="#94A3B8"/><text x="22" y="28" class="t-sub" text-anchor="middle">↑</text>
              <circle cx="22" cy="62" r="14" fill="#F1F5F9" stroke="#94A3B8"/><text x="22" y="66" class="t-sub" text-anchor="middle">↓</text>
            </g>
            ${badge(826, 472, 3)}

            <!-- Right Annotation Column -->
            <g transform="translate(852, 72)">
              <rect x="0" y="0" width="224" height="884" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
              <text x="14" y="24" class="t-sub">ARCHITECTURE &amp; FLOW</text>
              <line x1="14" y1="34" x2="210" y2="34" stroke="#CBD5E1"/>

              ${badge(24, 62, 1)}
              <text x="40" y="60" class="t-callout">Header &amp; Global Look</text>
              <text x="14" y="80" class="t-body">• Stepper: jump to any chapter</text>
              <text x="14" y="96" class="t-body">• Theme: Light / Dark toggle</text>
              <text x="14" y="112" class="t-body">• CVD: Normal / Deutan / Protan</text>

              ${badge(24, 152, 2)}
              <text x="40" y="150" class="t-callout">Scrollama Triggers</text>
              <text x="14" y="170" class="t-body">• Chapter trigger (offset 0.4)</text>
              <text x="14" y="186" class="t-body">• Ch.1 step trigger (offset 0.55)</text>
              <text x="14" y="202" class="t-body">• Updates state.chapter &amp;</text>
              <text x="14" y="216" class="t-body">  state.trendMode / trendFocus</text>

              ${badge(24, 256, 3)}
              <text x="40" y="254" class="t-callout">Stop-based Navigation</text>
              <text x="14" y="274" class="t-body">• Stops = 8 chapters + 5 steps</text>
              <text x="14" y="290" class="t-body">• Side ↑/↓ buttons + ← / → keys</text>
              <text x="14" y="306" class="t-body">• Smooth scroll with pendingY</text>

              ${badge(24, 346, 4)}
              <text x="40" y="344" class="t-callout">State Bus (main.js)</text>
              <rect x="14" y="362" width="196" height="170" rx="6" fill="#FFFFFF" stroke="#94A3B8"/>
              <text x="24" y="382" class="t-mono" font-weight="700">INITIAL_STATE</text>
              <text x="24" y="400" class="t-mono">• chapter: "s-start"</text>
              <text x="24" y="416" class="t-mono">• wardPlayed: false</text>
              <text x="24" y="432" class="t-mono">• trendMode: "index"</text>
              <text x="24" y="448" class="t-mono">• trendFocus: null</text>
              <text x="24" y="464" class="t-mono">• sevMeasure: "los"</text>
              <text x="24" y="480" class="t-mono">• ageGroup / ageMeasure</text>
              <text x="24" y="496" class="t-mono">• mapGroup / mapState</text>
              <text x="24" y="512" class="t-mono">• role / theme / cvd</text>

              <text x="14" y="560" class="t-sub">COLOUR ENCODING RULE</text>
              <rect x="14" y="572" width="14" height="14" rx="3" fill="#E11D48"/>
              <text x="34" y="583" class="t-body">Pedestrian (Red)</text>
              <rect x="14" y="594" width="14" height="14" rx="3" fill="#0D9488"/>
              <text x="34" y="605" class="t-body">Cyclist (Teal)</text>
              <rect x="14" y="616" width="14" height="14" rx="3" fill="#7C3AED"/>

              <rect x="0" y="0" width="56" height="18" rx="4" fill="#E0F2FE"/><text x="28" y="12" class="t-callout" text-anchor="middle">System</text>
              <text x="64" y="12" class="t-body">30–40 km/h speed limits where many people walk [cite]</text>

              <rect x="0" y="24" width="56" height="18" rx="4" fill="#FEF3C7"/><text x="28" y="36" class="t-muted" text-anchor="middle" font-weight="700">Driver</text>
              <text x="64" y="36" class="t-body">Slow down near people on foot; leave ≥ 1 m passing a bike [cite]</text>

              <rect x="0" y="48" width="56" height="18" rx="4" fill="#F1F5F9"/><text x="28" y="60" class="t-muted" text-anchor="middle">Extra</text>
              <text x="64" y="60" class="t-body">Role-specific protective actions + renderCites(panel)</text>
              ${badge(536, 10, 2)}
            </g>

            <!-- Interaction Panel -->
            <g transform="translate(624, 68)">
              <rect x="0" y="0" width="272" height="286" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
              <text x="14" y="24" class="t-sub">INTERACTION &amp; STATE</text>
              <line x1="14" y1="34" x2="258" y2="34" stroke="#CBD5E1"/>
              <text x="14" y="54" class="t-mono" font-weight="700">Watch: state.role</text>

              ${badge(24, 86, 1)}
              <text x="40" y="84" class="t-callout">Role Button Emit</text>
              <text x="14" y="104" class="t-body">Click button → emit(root, { role })</text>
              <text x="14" y="120" class="t-body">Updates active pill &amp; aria-pressed.</text>

              ${badge(24, 152, 2)}
              <text x="40" y="150" class="t-callout">Safe System Ordering</text>
              <text x="14" y="170" class="t-body">Always lists System &amp; Driver actions</text>
              <text x="14" y="186" class="t-body">before "Extra protection" so it avoids</text>
              <text x="14" y="202" class="t-body">victim-blaming framing.</text>

              <text x="14" y="238" class="t-sub">LIVE REGION</text>
              <text x="14" y="256" class="t-body">aria-live="polite" + renderCites()</text>
              <text x="14" y="272" class="t-body">links each action to Sources.</text>
            </g>
          </svg>
        `
      }
    ];

    const root = document.getElementById("cards-root");
    const toast = document.getElementById("toast");
    let toastTimer;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.remove("is-hidden");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.add("is-hidden"), 2400);
    }

    function renderCards(filter = "all") {
      const items = filter === "all" ? WIREFRAMES : WIREFRAMES.filter((w) => w.id === filter);
      root.innerHTML = items.map((w) => `
        <section class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 space-y-3 shadow-sm" data-card-id="${w.id}">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div>
              <h2 class="text-sm font-bold text-[var(--foreground)]">${w.title}</h2>
              <p class="text-xs text-[var(--muted-foreground)] mt-0.5">${w.subtitle}</p>
            </div>
            <div class="flex flex-wrap items-center gap-1.5">
              <button class="btn-copy-svg px-2.5 py-1 text-xs font-medium rounded border border-[var(--border)] hover:bg-[var(--accent)]/10 cursor-pointer" data-id="${w.id}">
                📋 Copy SVG
              </button>
              <button class="btn-dl-svg px-2.5 py-1 text-xs font-medium rounded border border-[var(--border)] hover:bg-[var(--accent)]/10 cursor-pointer" data-id="${w.id}">
                ⬇ SVG
              </button>
              <button class="btn-dl-png px-2.5 py-1 text-xs font-medium rounded bg-[var(--primary)] text-[var(--primary-foreground)] hover:opacity-90 cursor-pointer" data-id="${w.id}">
                🖼 PNG (Canvas 2×)
              </button>
            </div>
          </div>

          <div class="wf-svg-wrap" id="svg-wrap-${w.id}">
            ${w.svg()}
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-2.5 pt-1">
            ${w.interactions.map((it) => `
              <div class="p-2.5 rounded-lg bg-[var(--background)] border border-[var(--border)]">
                <div class="flex items-center gap-2 mb-1">
                  <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-blue-600 text-white text-xs font-bold">${it.tag}</span>
                  <span class="text-xs font-semibold">${it.title}</span>
                </div>
                <p class="text-xs text-[var(--muted-foreground)] leading-relaxed">${it.desc}</p>
              </div>
            `).join("")}
          </div>
        </section>
      `).join("");

      root.querySelectorAll(".btn-dl-svg").forEach((b) => b.addEventListener("click", () => downloadSvg(b.dataset.id)));
      root.querySelectorAll(".btn-dl-png").forEach((b) => b.addEventListener("click", () => downloadPng(b.dataset.id)));
      root.querySelectorAll(".btn-copy-svg").forEach((b) => b.addEventListener("click", () => copySvg(b.dataset.id)));
    }

    function getSvgMarkup(id) {
      const w = WIREFRAMES.find((x) => x.id === id);
      return w.svg().trim();
    }

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function downloadSvg(id) {
      const w = WIREFRAMES.find((x) => x.id === id);
      const blob = new Blob([getSvgMarkup(id)], { type: "image/svg+xml;charset=utf-8" });
      triggerDownload(blob, `${w.filename}.svg`);
      showToast(`Đã export ${w.filename}.svg (kéo thả trực tiếp vào Canva / Figma / Excalidraw)`);
    }

    function downloadPng(id) {
      const w = WIREFRAMES.find((x) => x.id === id);
      const svgEl = document.querySelector(`#svg-wrap-${id} svg`);
      const vb = svgEl.viewBox.baseVal;
      const scale = 2;
      const canvas = document.getElementById("export-canvas");
      canvas.width = vb.width * scale;
      canvas.height = vb.height * scale;
      const ctx = canvas.getContext("2d");

      const svgBlob = new Blob([getSvgMarkup(id)], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();
      img.onload = () => {
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob((pngBlob) => {
          triggerDownload(pngBlob, `${w.filename}@2x.png`);
          showToast(`Đã export ${w.filename}@2x.png qua HTML5 Canvas!`);
        }, "image/png");
      };
      img.src = url;
    }

    async function copySvg(id) {
      try {
        await navigator.clipboard.writeText(getSvgMarkup(id));
        showToast("Đã copy mã SVG! Dán trực tiếp vào Figma, Excalidraw hoặc Canva.");
      } catch {
        showToast("Không thể truy cập clipboard — hãy dùng nút ⬇ SVG.");
      }
    }

    // Tabs
    document.getElementById("tabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".tab-btn");
      if (!btn) return;
      document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("is-active"));
      btn.classList.add("is-active");
      renderCards(btn.dataset.filter);
    });

    // Export All
    document.getElementById("export-all-svg").addEventListener("click", () => {
      WIREFRAMES.forEach((w, i) => setTimeout(() => downloadSvg(w.id), i * 180));
    });
    document.getElementById("export-all-png").addEventListener("click", () => {
      // Ensure all cards are in DOM or render temp
      const active = document.querySelector(".tab-btn.is-active").dataset.filter;
      if (active !== "all") {
        document.querySelector('[data-filter="all"]').click();
      }
      WIREFRAMES.forEach((w, i) => setTimeout(() => downloadPng(w.id), i * 220));
    });

    renderCards("all");
  </script>
</body>
</html>
